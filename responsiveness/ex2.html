<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            background-color:rgb(79, 77, 77);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        /* Hide checkbox */
        #menu {
            display: none;
        }

        /* Hamburger label */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 30px;
            height: 3px;
            background-color: white;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: rgb(79, 77, 77);
                flex-direction: column;
                gap: 0;
                padding: 0;
                max-height: 0;
                overflow: hidden;
            }

            .nav-links li {
                padding: 15px 30px;
                border-top: 1px solid #555;
            }

            .hamburger {
                display: flex;
            }

            #menu:checked ~ .nav-links {
                max-height: 300px;
            }

        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Logo</div>
        
        <input type="checkbox" id="menu">
        
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <label for="menu" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>
    </nav>
</body>
</html>
